<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ANTAI</title>
<style>html,body{margin:0;height:100%;background:#40492E}
body{background:linear-gradient(180deg,rgba(64,73,46,.55),rgba(64,73,46,.45)),url('assets/bg-hojas-m.jpg') center/cover no-repeat #40492E}

iframe.on{opacity:1;pointer-events:auto}@media (hover:none){body{background:linear-gradient(180deg,rgba(64,73,46,.2),rgba(64,73,46,.12)),url('assets/bg-hojas-m.jpg') center/cover no-repeat #6b7552}}</style></head>
<body>
<script>
var frames={},cur=null,HOME='Antai Web.dc.html',ORDER=['Antai Web.dc.html','Encontra tu momento.dc.html','Conoce lo que elegis.dc.html','Bienestar.dc.html'];
function ver(h){var p=h.split('#');return p[0]+(p[0].indexOf('?')<0?'?v=20261008a':'')+(p[1]?'#'+p[1]:'')}
function keyOf(h){var f=h.split('#')[0];return /^Formula/.test(f)?h:f}
function mk(href){var k=keyOf(href);if(frames[k])return frames[k];
  var f=document.createElement('iframe');f.title='ANTAI';f.src=ver(href);document.body.appendChild(f);
  var o={el:f,ready:false,waiters:[]};frames[k]=o;
  f.addEventListener('load',function(){setTimeout(function(){if(!o.ready){o.ready=true;o.waiters.splice(0).forEach(function(w){w()})}},2500)});
  return o}
window.addEventListener('message',function(e){
  var d=e.data||{};
  Object.keys(frames).forEach(function(k){if(frames[k].el.contentWindow===e.source&&d.antaiReady&&!frames[k].ready){frames[k].ready=true;frames[k].waiters.splice(0).forEach(function(w){w()})}});
  if(d.antaiGo)show(d.antaiGo);
});
function show(href){var o=mk(href),k=keyOf(href),hash=href.split('#')[1];cur=k;
  var run=function(){if(cur!==k)return;
    var prev=Object.keys(frames).filter(function(x){return x!==k&&frames[x].el.classList.contains('on')});Z=(window.Z=(window.Z||1)+1);o.el.classList.remove('off');o.el.style.zIndex=Z;o.el.classList.add('on');setTimeout(function(){if(cur!==k)return;prev.forEach(function(x){var e=frames[x].el;e.classList.add('off');e.classList.remove('on');})},950);
    try{var w=o.el.contentWindow,doc=o.el.contentDocument,el=hash&&doc.getElementById(decodeURIComponent(hash));
      if(/^Formula/.test(k)){}else if(el){w.scrollTo(0,el.getBoundingClientRect().top+w.scrollY-62)}else{w.scrollTo(0,0)}}catch(x){}};
  if(o.ready)run;else o.waiters.push(run);
  if(o.ready)run();}
function preload(i){if(i>=ORDER.length)return;mk(ORDER[i]);setTimeout(function(){preload(i+1)},900)}
show(HOME);setTimeout(function(){preload(1)},1200);
</script></body></html>
